name: Deploy Interactive Gallery to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::knitr, any::rmarkdown
      - name: Assemble gallery and rendered vignettes
        run: |
          R CMD build --no-manual .
          site="$RUNNER_TEMP/gallery-site"
          mkdir -p "$site/doc"
          # The gallery is at the site root and in gallery/ in an R installation.
          sed 's|href="../doc/|href="doc/|g' inst/gallery/index.html > "$site/index.html"
          tar -xz -f glmmplanr_*.tar.gz -C "$site/doc" --strip-components=3 \
            glmmplanr/inst/doc/planning-workflows.html \
            glmmplanr/inst/doc/validation-and-scope.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/gallery-site
      - id: deployment
        uses: actions/deploy-pages@v4
